syntax = "proto3";

package mlxtensor;

service MLXTensorService {
  rpc SendTensor (SendTensorRequest) returns (TensorResponse) {}
  rpc ResetCache (ResetCacheRequest) returns (ResetCacheResponse) {}
}

// Original tensor message (keep for backward compatibility)
message Tensor {
  bytes tensor_data = 1;
  repeated int32 shape = 2;
  string dtype = 3;
}

// NEW: Chunked tensor message
message TensorChunk {
  string tensor_id = 1;      // UUID for this tensor transfer
  int32 chunk_index = 2;     // 0, 1, 2, ... (order matters)
  int32 total_chunks = 3;    // Total number of chunks
  bytes chunk_data = 4;      // Actual data for this chunk
  repeated int32 shape = 5;  // Full tensor shape (sent with every chunk for validation)
  string dtype = 6;          // Tensor dtype (sent with every chunk)
}

// NEW: Request that supports both chunked and non-chunked
message SendTensorRequest {
  oneof tensor_payload {
    Tensor full_tensor = 1;        // For small tensors (< 10MB)
    TensorChunk chunked_tensor = 2; // For large tensors (>= 10MB)
  }
  string session_id = 3;           // Session ID for cache synchronization
}

message TensorResponse {
  bool success = 1;
  string message = 2;
  Tensor tensor = 3;
}

message ResetCacheRequest {
}

message ResetCacheResponse {
  bool success = 1;
  string message = 2;
}